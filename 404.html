<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | CallMe Live</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="styles.css">
    <meta http-equiv="refresh" content="5;url=/">
</head>
<body>
    <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center">
        <div style="max-width:520px">
            <div style="font-size:5rem;margin-bottom:20px">📞</div>
            <h1 style="font-size:3rem;margin:0 0 10px;background:linear-gradient(135deg,#ff006e,#8338ec,#3a86ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">404</h1>
            <h2 style="margin:0 0 15px;color:#fff">Call Got Disconnected</h2>
            <p style="color:#a8a8b8;margin:0 0 30px">The page you're looking for doesn't exist or has moved. Redirecting you home...</p>
            <a href="/" style="display:inline-flex;align-items:center;gap:10px;padding:14px 32px;background:linear-gradient(135deg,#ff006e,#8338ec);color:#fff;text-decoration:none;border-radius:50px;font-weight:700;box-shadow:0 8px 25px rgba(255,0,110,0.4)">
                ⚡ Go to Home
            </a>
            <p style="margin-top:25px;color:#86869b;font-size:0.85rem">If not redirected automatically, click the button above.</p>
        </div>
    </main>
</body>
</html>
